name: entrance_720_words
description: "入学必备720字 - 识字学习App（MVP测试版）"
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 图标 / 启动图生成（一次性工具，不参与运行时）
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/onboarding/
    - assets/data/
    - assets/audio/manifest.json
    - assets/audio/chars/
    - assets/audio/words/
    - assets/audio/sentences/
  fonts:
    - family: KaiTiCustom
      fonts:
        - asset: assets/fonts/LXGWWenKai-Subset.ttf

# 桌面图标：dart run flutter_launcher_icons
# 源图 assets/branding/app_icon.png 需为 1024×1024、无圆角遮罩的整张方形图
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#F4EAD8"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

# 启动图：dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F4EAD8"
  image: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    image: assets/branding/splash_logo.png
    color: "#F4EAD8"
